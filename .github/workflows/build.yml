name: Build NoiseCancelToggle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ runner.temp }}/theos
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV

      - name: Setup SDK
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks-master/iPhoneOS*.sdk $THEOS/sdks/
          echo "SDK installed: $(ls $THEOS/sdks/)"

      - name: Copy Private Frameworks
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          THEOS_SDK=$(ls -d /tmp/sdks-master/iPhoneOS*.sdk | head -1)
          mkdir -p "$THEOS_SDK/System/Library/PrivateFrameworks"
          cp -r "$SDK_PATH/System/Library/PrivateFrameworks/BluetoothManager.framework" "$THEOS_SDK/System/Library/PrivateFrameworks/"

      - name: Generate Icon
        run: python3 scripts/gen_icon.py NoiseCancelToggleApp/icon.png

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseCancelToggle-deb
          path: packages/*.deb